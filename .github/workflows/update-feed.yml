name: Update promo feed

on:
  schedule:
    # Twice an hour; GitHub may start scheduled jobs with a delay.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect promo codes
        shell: pwsh
        continue-on-error: true
        run: ./collector.ps1 -Force

      - name: Validate feed
        shell: pwsh
        run: |
          $feed = Get-Content -Raw data/codes.json -Encoding UTF8 | ConvertFrom-Json
          $total = @($feed.codes).Count
          $confirmed = @($feed.codes | Where-Object { $_.verification -eq 'confirmed' }).Count
          Write-Host "Codes: $total; confirmed: $confirmed; services: $($feed.stats.services); sources: $($feed.stats.sources)"
          if ($total -lt 20) { throw "Feed too small: $total codes" }
          $bad = @($feed.codes | Where-Object { $_.code -notmatch '^[A-Za-zА-Яа-я0-9_-]{3,32}$' })
          if ($bad.Count -gt 0) { throw "Invalid codes: $($bad.Count)" }

      - name: Commit updated feed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/codes.json data/state.json data/source-health.json
          $changes = git status --porcelain data/codes.json data/state.json data/source-health.json
          if ($changes) {
            git commit -m "chore: update promo feed"
            git push
          } else {
            Write-Host "Feed is unchanged"
          }
