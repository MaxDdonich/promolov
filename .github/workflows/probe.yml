name: probe sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Save vkusvill page
        shell: pwsh
        run: |
          $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          curl.exe -s -L --compressed --max-time 40 -A $ua -H 'Accept-Language: ru-RU,ru;q=0.9' 'https://vkusvill.ru/promo/' -o vkus-promo.html -w 'status=%{http_code} size=%{size_download}'
          if (Test-Path vkus-promo.html) {
            $h = [IO.File]::ReadAllText('vkus-promo.html', [Text.Encoding]::UTF8)
            Write-Host "len=$($h.Length) promo=$(([regex]::Matches($h, '(?i)промокод')).Count) dataCode=$(([regex]::Matches($h, 'data-code')).Count) codeTags=$(([regex]::Matches($h, '<code')).Count)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: vkus-promo
          path: vkus-promo.html
