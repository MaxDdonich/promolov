name: Probe promo sources 2

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe candidates
        shell: pwsh
        run: |
          $web = @(
            'https://promokodi.net/ru/',
            'https://promokodus.com/',
            'https://www.pepper.ru/',
            'https://promo.habr.com/',
            'https://promokod.vbr.ru/',
            'https://promkod.ru/',
            'https://picodi.com/ru',
            'https://promokodiq.ru/',
            'https://rukodi.com/ru/catalog/',
            'https://bonkod.com/ru/',
            'https://hotkod.ru/',
            'https://promosave.ru/',
            'https://promokod.store/',
            'https://promokod.store/shops/',
            'https://promokod.store/category/dostavka-edy/',
            'https://promokodik.ru/',
            'https://promokodix.ru/',
            'https://coupon.ru/',
            'https://kupongid.ru/',
            'https://promokod.guru/',
            'https://promokodiki.ru/',
            'https://promokody.com/',
            'https://promokody.net/',
            'https://promokody.org/',
            'https://promokod.com.ua/',
            'https://promokod.ru/',
            'https://promo-kod.ru/',
            'https://promo-kod.com/',
            'https://promocodes.ru/',
            'https://promocode.com.ua/',
            'https://kupon.ua/',
            'https://pokupon.ua/',
            'https://skidka.ua/',
            'https://promokod.one/',
            'https://promokod.pro/',
            'https://promokod.xyz/',
            'https://promokod.app/',
            'https://promokod.page/',
            'https://promokod.blog/',
            'https://promokod.zone/',
            'https://promokod.team/',
            'https://promokod.club/',
            'https://promokod.center/',
            'https://promokod.name/',
            'https://promokod.ws/',
            'https://promokod.me/',
            'https://promokod.net/',
            'https://promokod.org/',
            'https://promokod.biz/',
            'https://promokod.link/',
            'https://promokod.shop/',
            'https://promokod.space/',
            'https://promokod.website/',
            'https://promokod.digital/',
            'https://promokod.today/',
            'https://promokod.info/',
            'https://promokod.top/',
            'https://promokod.online/',
            'https://promokod24.ru/',
            'https://promokodler.ru/',
            'https://promokody.info/',
            'https://promo-code.ru/',
            'https://akcii.ru/',
            'https://skidki.ru/',
            'https://discount.ru/',
            'https://kuponchik.ru/',
            'https://kuponika.ru/',
            'https://kuponator.ru/',
            'https://promokodchik.ru/',
            'https://promokodik.com/',
            'https://promokodov.ru/',
            'https://promokodka.ru/',
            'https://promokodoff.ru/',
            'https://promokodnik.ru/',
            'https://promokod.expert/',
            'https://promocode.ru/',
            'https://promokod365.ru/',
            'https://skidkium.ru/',
            'https://promokod-blog.ru/',
            'https://vkusvill.ru/promo/',
            'https://samokat.ru/promokody',
            'https://kuper.ru/promo',
            'https://dodopizza.ru/promokody',
            'https://sushiwok.ru/promo',
            'https://justfood.ru/promo',
            'https://elementaree.ru/promo',
            'https://growfood.ru/promo',
            'https://levelkitchen.ru/promo'
          )

          $tg = @(
            'promokody',
            'promokod_eda',
            'promokody_skidki',
            'promokod_kfc',
            'promokod_yandex_eda',
            'promokod_rostics',
            'promokod_magnit',
            'promokod_perekrestok',
            'promokod_kuper',
            'promokod_vkusvill',
            'promokod_dostavka_edy',
            'promokody_dostavka_edy',
            'promokod_dlya_dostavki',
            'promokody_na_dostavku',
            'skidki_na_edu',
            'promokod_ozon_fresh',
            'promokod_samokat',
            'promokod_vkusnoitochka',
            'promokod_burgerking',
            'promokod_tanuki',
            'promokod_yakitoria',
            'promokod_pizzahut',
            'promokod_papajohns',
            'promokod_growfood',
            'promokod_levelkitchen'
          )

          $targets = @()
          foreach ($u in $web) { $targets += [pscustomobject]@{ kind = 'web'; url = $u } }
          foreach ($c in $tg) { $targets += [pscustomobject]@{ kind = 'tg'; url = "https://t.me/s/$c" } }

          $results = $targets | ForEach-Object -Parallel {
            $t = $_
            $f = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N') + '.html')
            $status = '000'; $size = 0; $promo = 0; $markers = 0; $messages = 0; $platform = ''; $title = ''; $sample = @(); $food = 0

            try {
              $status = curl.exe -s -L --compressed --max-time 15 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36' -H 'Accept-Language: ru-RU,ru;q=0.9' $t.url -o $f -w '%{http_code}'
              if (Test-Path $f) {
                $h = [IO.File]::ReadAllText($f, [Text.Encoding]::UTF8)
                $size = $h.Length
                $promo = ([regex]::Matches($h, '(?i)промокод')).Count
                $markers = ([regex]::Matches($h, 'data-code=|data-promo|data-coupon|data-clipboard-text=|card-code|promoCode|promocode|__NUXT_DATA__|__NEXT_DATA__|offer__code|<code')).Count
                $messages = ([regex]::Matches($h, 'tgme_widget_message_wrap')).Count
                $food = ([regex]::Matches($h, '(?i)вкусвилл|самокат|купер|яндекс\s*еда|додо|пицц|суши|перекр[её]ст|магнит|пят[её]роч|дикси|ашан|ozon\s*fresh|доставк')).Count

                if ($h -match '__NUXT_DATA__') { $platform = 'nuxt' }
                elseif ($h -match '__NEXT_DATA__') { $platform = 'next' }
                elseif ($h -match 'wp-content|wp-json') { $platform = 'wordpress' }
                elseif ($h -match 'bitrix') { $platform = 'bitrix' }
                elseif ($h -match 'tgme_widget') { $platform = 'telegram' }

                $title = [regex]::Match($h, '(?is)<title[^>]*>(.*?)</title>').Groups[1].Value
                if ($title) { $title = ($title -replace '<[^>]+>', ' ' -replace '\s+', ' ').Trim() }
                if ($title.Length -gt 120) { $title = $title.Substring(0, 120) }

                $codes = @()
                foreach ($m in [regex]::Matches($h, '(?:data-code|data-promo|data-coupon|data-clipboard-text)="([A-Za-z0-9_-]{3,32})"')) { $codes += $m.Groups[1].Value }
                foreach ($m in [regex]::Matches($h, '(?:card-code__val|offer__code-val)[^>]*>\s*([A-Za-z0-9_-]{3,32})\s*<')) { $codes += $m.Groups[1].Value }
                foreach ($m in [regex]::Matches($h, '(?i)(?:promoCode|promocode)["'']?\s*[:=]\s*["'']([A-Za-z0-9_-]{3,32})["'']')) { $codes += $m.Groups[1].Value }
                if ($t.kind -eq 'tg') {
                  foreach ($m in [regex]::Matches($h, '(?is)tgme_widget_message_text[^>]*>(.*?)</div>')) {
                    $text = $m.Groups[1].Value -replace '<[^>]+>', ' '
                    foreach ($c in [regex]::Matches($text, '\b[A-Z0-9][A-Z0-9_-]{3,20}\b')) {
                      if ($c.Value -notmatch '^(HTML|HTTP|HTTPS|NULL|TRUE|FALSE|DIV|SPAN|BR|TGME|TELEGRAM|PROMOKOD|PROMOCODE|СКИДКА|БЕСПЛАТНО)$') { $codes += $c.Value }
                    }
                  }
                }
                $sample = @($codes | Select-Object -Unique -First 8)
              }
            }
            catch { $status = 'ERR' }
            finally { Remove-Item $f -ErrorAction SilentlyContinue }

            [pscustomobject]@{ kind = $t.kind; url = $t.url; status = [string]$status; size = $size; promo = $promo; markers = $markers; messages = $messages; platform = $platform; food = $food; title = $title; sample = @($sample) }
          } -ThrottleLimit 10

          $results | ConvertTo-Json -Depth 5 | Set-Content probe2.json -Encoding UTF8

          Write-Host '=== WEB 200 ==='
          $results | Where-Object { $_.kind -eq 'web' -and $_.status -eq '200' } | Sort-Object markers -Descending |
            ForEach-Object { Write-Host ("markers={0,4} promo={1,4} food={2,4} {3,-10} {4}" -f $_.markers,$_.promo,$_.food,$_.platform,$_.url) }

          Write-Host '=== TELEGRAM ==='
          $results | Where-Object { $_.kind -eq 'tg' } | Sort-Object messages -Descending |
            ForEach-Object { Write-Host ("msgs={0,3} promo={1,4} codes={2,3} {3}" -f $_.messages,$_.promo,$_.sample.Count,$_.url) }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-results-2
          path: probe2.json
