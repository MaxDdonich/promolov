name: Daily push summary

on:
  schedule:
    # 06:00 UTC = 09:00 Moscow
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send daily push
        shell: pwsh
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PROXY_URL: ${{ secrets.TELEGRAM_PROXY_URL }}
          TELEGRAM_PROXY_SECRET: ${{ secrets.TELEGRAM_PROXY_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: ./scripts/telegram-notify.ps1 -Mode daily
