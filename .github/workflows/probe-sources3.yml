name: Probe promo sources 3

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe candidates
        shell: pwsh
        run: |
          $web = @(
            'https://kuponoed.ru/promokody-na-dostavku-produktov/',
            'https://hl.ru/food',
            'https://okodo.ru/',
            'https://promocodex.ru/categories/food/',
            'https://promocodex.ru/categories/restaurants/',
            'https://promokodikov.ru/category/dostavka-edy/',
            'https://promko.net/ru/categories/dostavka-edy',
            'https://promokong.ru/pervyj-zakaz',
            'https://lavka.yandex.ru/about/promocody',
            'https://eda.yandex.ru/promo/skidki',
            'https://promokod.vbr.ru/categories/dostavka-edy/',
            'https://promkod.ru/category/food',
            'https://promkod.ru/category/food-delivery',
            'https://promokod.store/promokody/eda-i-napitki',
            'https://hotkod.ru/restaurants/',
            'https://promokodus.com/categories/eda',
            'https://picodi.com/ru/categories/food',
            'https://promokodik.ru/category/eda/',
            'https://promokodiq.ru/categories/food/',
            'https://promosave.ru/category/food/',
            'https://coupon.ru/category/food/',
            'https://promokod.store/promokody/dostavka-edy',
            'https://promokod.store/promokody/restorany',
            'https://promokod.store/promokody/produkty',
            'https://promokod.store/promokody/eda-i-napitki?page=2',
            'https://promokod.store/promokody/eda-i-napitki?page=3'
          )

          $targets = @()
          foreach ($u in $web) { $targets += [pscustomobject]@{ kind = 'web'; url = $u } }

          $results = $targets | ForEach-Object -Parallel {
            $t = $_
            $f = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N') + '.html')
            $status = '000'; $size = 0; $promo = 0; $markers = 0; $platform = ''; $title = ''; $sample = @(); $food = 0; $items = 0

            try {
              $status = curl.exe -s -L --compressed --max-time 18 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36' -H 'Accept-Language: ru-RU,ru;q=0.9' $t.url -o $f -w '%{http_code}'
              if (Test-Path $f) {
                $h = [IO.File]::ReadAllText($f, [Text.Encoding]::UTF8)
                $size = $h.Length
                $promo = ([regex]::Matches($h, '(?i)промокод')).Count
                $markers = ([regex]::Matches($h, 'data-code=|data-promo|data-coupon|data-clipboard-text=|card-code|promoCode|promocode|__NUXT_DATA__|__NEXT_DATA__|offer__code|<code')).Count
                $items = ([regex]::Matches($h, '(?i)couponRow|promo-card|promo-item|kuponiq-coupon-block|coupon-item|promocode-item|offer-card')).Count
                $food = ([regex]::Matches($h, '(?i)вкусвилл|самокат|купер|яндекс\s*еда|додо|пицц|суши|перекр[её]ст|магнит|пят[её]роч|дикси|ашан|ozon\s*fresh|доставк')).Count

                if ($h -match '__NUXT_DATA__') { $platform = 'nuxt' }
                elseif ($h -match '__NEXT_DATA__') { $platform = 'next' }
                elseif ($h -match 'wp-content|wp-json') { $platform = 'wordpress' }
                elseif ($h -match 'bitrix') { $platform = 'bitrix' }

                $title = [regex]::Match($h, '(?is)<title[^>]*>(.*?)</title>').Groups[1].Value
                if ($title) { $title = ($title -replace '<[^>]+>', ' ' -replace '\s+', ' ').Trim() }
                if ($title.Length -gt 120) { $title = $title.Substring(0, 120) }

                $codes = @()
                foreach ($m in [regex]::Matches($h, '(?:data-code|data-promo|data-coupon|data-clipboard-text)="([A-Za-zА-Яа-я0-9_-]{3,32})"')) { $codes += $m.Groups[1].Value }
                foreach ($m in [regex]::Matches($h, '(?:card-code__val|offer__code-val)[^>]*>\s*([A-Za-zА-Яа-я0-9_-]{3,32})\s*<')) { $codes += $m.Groups[1].Value }
                foreach ($m in [regex]::Matches($h, '(?i)(?:promoCode|promocode)["'']?\s*[:=]\s*["'']([A-Za-z0-9_-]{3,32})["'']')) { $codes += $m.Groups[1].Value }
                foreach ($m in [regex]::Matches($h, '<code[^>]*>\s*([A-Za-zА-Яа-я0-9_-]{3,32})\s*</code>')) { $codes += $m.Groups[1].Value }
                $sample = @($codes | Select-Object -Unique -First 10)
              }
            }
            catch { $status = 'ERR' }
            finally { Remove-Item $f -ErrorAction SilentlyContinue }

            [pscustomobject]@{ kind = $t.kind; url = $t.url; status = [string]$status; size = $size; promo = $promo; markers = $markers; items = $items; platform = $platform; food = $food; title = $title; sample = @($sample) }
          } -ThrottleLimit 10

          $results | ConvertTo-Json -Depth 5 | Set-Content probe3.json -Encoding UTF8

          Write-Host '=== WEB 200 ==='
          $results | Where-Object { $_.status -eq '200' } | Sort-Object markers -Descending |
            ForEach-Object { Write-Host ("markers={0,4} promo={1,4} items={2,3} food={3,4} {4} | {5}" -f $_.markers,$_.promo,$_.items,$_.food,$_.url,($_.sample -join ',')) }
          Write-Host '=== NON 200 ==='
          $results | Where-Object { $_.status -ne '200' } | ForEach-Object { Write-Host ("status={0} {1}" -f $_.status,$_.url) }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-results-3
          path: probe3.json
