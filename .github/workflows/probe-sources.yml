name: Probe promo sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe candidates
        shell: pwsh
        run: |
          $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'

          $web = @(
            'https://promokod.com/',
            'https://promokod.pikabu.ru/',
            'https://www.promokodex.ru/',
            'https://promokodi.komukupon.ru/',
            'https://promokod.site/',
            'https://www.kp.ru/promokod/',
            'https://ecosum.ru/',
            'https://promokodik.ru/',
            'https://promokodoff.ru/',
            'https://promokodka.ru/',
            'https://promokod.guru/',
            'https://kupongid.ru/',
            'https://www.picodi.ru/',
            'https://coupon.ru/',
            'https://promokodus.ru/',
            'https://promokod24.ru/',
            'https://promokody.info/',
            'https://promo-code.ru/',
            'https://promokodix.ru/',
            'https://promokodler.ru/',
            'https://skidki.ru/',
            'https://akcii.ru/',
            'https://kuponchik.ru/',
            'https://kuponika.ru/',
            'https://kuponator.ru/',
            'https://promokodchik.ru/',
            'https://promokodik.com/',
            'https://promokodov.ru/',
            'https://promokod.info/',
            'https://promokod.top/',
            'https://promokod.club/',
            'https://promokod.online/',
            'https://promokod.today/',
            'https://promokod.center/',
            'https://promokod.name/',
            'https://promokod.ws/',
            'https://promokod.me/',
            'https://promokod.net/',
            'https://promokod.org/',
            'https://promokod.biz/',
            'https://promokod.link/',
            'https://promokod.shop/',
            'https://promokod.store/',
            'https://promokod.space/',
            'https://promokod.website/',
            'https://promokod.digital/',
            'https://skidka.com/',
            'https://discount.ru/',
            'https://kupon.pro/',
            'https://kupon.net/',
            'https://promokod.by/',
            'https://promokod.kz/',
            'https://promokod.ua/',
            'https://promo.ua/',
            'https://coupon.ua/',
            'https://edadeal.ru/',
            'https://utkonos.ru/promo',
            'https://okeydostavka.ru/promo',
            'https://vkusvill.ru/promo/',
            'https://samokat.ru/promokody',
            'https://kuper.ru/promo',
            'https://dodopizza.ru/promokody',
            'https://dominos.ru/promo',
            'https://sushiwok.ru/promo',
            'https://yobidoyobi.ru/promo',
            'https://rostics.ru/promo',
            'https://kfc.ru/promo',
            'https://burgerking.ru/promo',
            'https://vkusnoitochka.ru/promo',
            'https://tanuki.ru/promo',
            'https://yakitoria.ru/promo',
            'https://pizzahut.ru/promo',
            'https://papajohns.ru/promo',
            'https://growfood.ru/promo',
            'https://levelkitchen.ru/promo',
            'https://letsfood.ru/promo',
            'https://chefmike.ru/promo',
            'https://justfood.ru/promo',
            'https://elementaree.ru/promo',
            'https://perekrestok.ru/promo',
            'https://magnit.ru/promo',
            'https://5ka.ru/actions',
            'https://ozon.ru/promo',
            'https://eda.yandex.ru/promo',
            'https://lavka.yandex.ru/promo',
            'https://av.ru/promo',
            'https://lenta.com/promo',
            'https://globus.ru/promo',
            'https://metro-cc.ru/promo',
            'https://dixy.ru/promo',
            'https://sushimaster.ru/promo',
            'https://chaihona.ru/promo',
            'https://onepricecoffee.ru/promo',
            'https://cofix.ru/promo'
          )

          $tg = @(
            'promokody',
            'promokod_ru',
            'promokody_skidki',
            'skidki_promokody',
            'promokod_dostavka',
            'edapromokody',
            'promokody_eda',
            'dostavka_promokody',
            'promokod_yandex_eda',
            'samokat_promokody',
            'promokod_vkusvill',
            'promokod_dodo',
            'promokod_kuper',
            'promokod_magnit',
            'promokod_perekrestok',
            'promokod_pyaterochka',
            'promokod_ozon',
            'promokod_ozon_fresh',
            'promokody_dostavka_edy',
            'skidki_eda',
            'promokod_kfc',
            'promokod_burgerking',
            'promokod_rostics',
            'promokod_eda',
            'promokod_delivery',
            'promokody_24'
          )

          $vk = @(
            'promokody',
            'promokody_dostavka',
            'skidki_promokody',
            'eda_promokody',
            'promokod_ru',
            'dostavka_eda_promokody'
          )

          $targets = @()
          foreach ($u in $web) { $targets += [pscustomobject]@{ kind = 'web'; url = $u } }
          foreach ($c in $tg) { $targets += [pscustomobject]@{ kind = 'tg'; url = "https://t.me/s/$c" } }
          foreach ($c in $vk) { $targets += [pscustomobject]@{ kind = 'vk'; url = "https://m.vk.com/$c" } }

          $results = $targets | ForEach-Object -Parallel {
            $t = $_
            $f = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N') + '.html')
            $status = '000'
            $size = 0
            $promo = 0
            $markers = 0
            $messages = 0
            $platform = ''
            $title = ''
            $sample = @()
            $food = 0

            try {
              $status = curl.exe -s -L --compressed --max-time 15 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36' -H 'Accept-Language: ru-RU,ru;q=0.9' $t.url -o $f -w '%{http_code}'
              if (Test-Path $f) {
                $h = [IO.File]::ReadAllText($f, [Text.Encoding]::UTF8)
                $size = $h.Length
                $promo = ([regex]::Matches($h, '(?i)промокод')).Count
                $markers = ([regex]::Matches($h, 'data-code=|card-code|promoCode|__NUXT_DATA__|__NEXT_DATA__|offer__code|<code')).Count
                $messages = ([regex]::Matches($h, 'tgme_widget_message_wrap|wall_post')).Count
                $food = ([regex]::Matches($h, '(?i)вкусвилл|самокат|купер|яндекс\s*еда|додо|пицц|суши|перекр[её]ст|магнит|пят[её]роч|дикси|ашан|ozon\s*fresh|доставк')).Count

                if ($h -match '__NUXT_DATA__') { $platform = 'nuxt' }
                elseif ($h -match '__NEXT_DATA__') { $platform = 'next' }
                elseif ($h -match 'wp-content|wp-json') { $platform = 'wordpress' }
                elseif ($h -match 'bitrix') { $platform = 'bitrix' }
                elseif ($h -match 'tmgme_widget|tgme_widget') { $platform = 'telegram' }
                elseif ($h -match 'vk\.com') { $platform = 'vk' }

                $title = [regex]::Match($h, '(?is)<title[^>]*>(.*?)</title>').Groups[1].Value
                if ($title) { $title = ($title -replace '<[^>]+>', ' ' -replace '\s+', ' ').Trim() }
                if ($title.Length -gt 120) { $title = $title.Substring(0, 120) }

                $codes = @()
                foreach ($m in [regex]::Matches($h, '(?:data-code="|card-code__val">|offer__code-val[^>]*>|promoCode["'']?\s*[:=]\s*["''])([A-Za-z0-9_-]{3,32})')) {
                  $codes += $m.Groups[1].Value
                }
                foreach ($m in [regex]::Matches($h, '<code[^>]*>\s*([A-Za-z0-9_-]{3,32})\s*</code>')) {
                  $codes += $m.Groups[1].Value
                }
                if ($t.kind -eq 'tg') {
                  foreach ($m in [regex]::Matches($h, '(?is)tgme_widget_message_text[^>]*>(.*?)</div>')) {
                    $text = $m.Groups[1].Value -replace '<[^>]+>', ' '
                    foreach ($c in [regex]::Matches($text, '\b[A-Z0-9][A-Z0-9_-]{3,20}\b')) {
                      if ($c.Value -notmatch '^(HTML|HTTP|HTTPS|NULL|TRUE|FALSE|DIV|SPAN|BR|TGME|TELEGRAM|PROMOKOD|PROMOCODE|СКИДКА|БЕСПЛАТНО)$') {
                        $codes += $c.Value
                      }
                    }
                  }
                }
                $sample = @($codes | Select-Object -Unique -First 8)
              }
            }
            catch {
              $status = 'ERR'
            }
            finally {
              Remove-Item $f -ErrorAction SilentlyContinue
            }

            [pscustomobject]@{
              kind     = $t.kind
              url      = $t.url
              status   = [string]$status
              size     = $size
              promo    = $promo
              markers  = $markers
              messages = $messages
              platform = $platform
              food     = $food
              title    = $title
              sample   = @($sample)
            }
          } -ThrottleLimit 10

          $results | ConvertTo-Json -Depth 5 | Set-Content probe.json -Encoding UTF8

          Write-Host '=== ACCESSIBLE WEB WITH PROMO ==='
          $results | Where-Object { $_.kind -eq 'web' -and $_.status -eq '200' -and $_.promo -gt 0 } |
            Sort-Object promo -Descending |
            ForEach-Object { Write-Host ("{0,4} promo {1,4} markers {2,4} food  {3}  {4}" -f $_.promo, $_.markers, $_.food, $_.platform, $_.url) }

          Write-Host '=== TELEGRAM ==='
          $results | Where-Object { $_.kind -eq 'tg' } |
            Sort-Object messages -Descending |
            ForEach-Object { Write-Host ("{0,3} msgs {1,4} promo {2,3} codes  {3}" -f $_.messages, $_.promo, $_.sample.Count, $_.url) }

          Write-Host '=== VK ==='
          $results | Where-Object { $_.kind -eq 'vk' } |
            ForEach-Object { Write-Host ("status={0} size={1} msgs={2} {3}" -f $_.status, $_.size, $_.messages, $_.url) }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-results
          path: probe.json
