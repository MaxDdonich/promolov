name: Telegram once

on:
  workflow_dispatch:

jobs:
  once:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -sS -4 --http1.1 --max-time 15 -w "\nHTTP=%{http_code}\n" "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getMe" || true
          sleep 3
          curl -sS -4 --http1.1 --max-time 15 -w "\nHTTP=%{http_code}\n" "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getUpdates?limit=10" || true
